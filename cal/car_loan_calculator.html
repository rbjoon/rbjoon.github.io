<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이너스통장 상환 계산기</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 32px 16px;
      gap: 24px;
      flex-wrap: wrap;
    }
    .card {
      background: #fff; border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 32px 28px; width: 100%; max-width: 520px;
    }
    h1 { font-size: 1.25rem; color: #1a2a3a; margin-bottom: 4px; }
    .subtitle { font-size: 0.82rem; color: #8a9ab0; margin-bottom: 24px; }
    .info-row {
      display: flex; justify-content: space-between;
      background: #f7f9fb; border-radius: 10px;
      padding: 12px 16px; margin-bottom: 7px;
    }
    .info-label { color: #6b7c93; font-size: 0.88rem; }
    .info-value { color: #1a2a3a; font-weight: 600; font-size: 0.88rem; }
    .divider { border: none; border-top: 1px solid #e8edf2; margin: 18px 0; }
    label { display: block; font-size: 0.85rem; color: #6b7c93; margin-bottom: 7px; }
    .input-wrap { position: relative; margin-bottom: 16px; }
    .input-wrap input {
      width: 100%; padding: 13px 46px 13px 16px;
      border: 2px solid #e0e7ef; border-radius: 10px;
      font-size: 1.05rem; color: #1a2a3a; outline: none; transition: border 0.2s;
    }
    .input-wrap input:focus { border-color: #3b82f6; }
    .input-wrap .unit {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%); color: #8a9ab0; font-size: 0.88rem;
    }
    .breakdown {
      background: #f0fdf4; border: 1px solid #bbf7d0;
      border-radius: 12px; padding: 16px; margin-bottom: 16px; display: none;
    }
    .breakdown-title { font-size: 0.8rem; color: #16a34a; font-weight: 600; margin-bottom: 10px; }
    .breakdown-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 0; border-bottom: 1px solid #dcfce7;
    }
    .breakdown-row:last-of-type { border-bottom: none; }
    .br-label { font-size: 0.83rem; color: #6b7c93; }
    .br-value { font-size: 0.92rem; font-weight: 600; }
    .br-value.interest { color: #dc2626; }
    .br-value.principal { color: #2563eb; }
    .br-value.remaining { color: #6b7c93; }
    .progress-bar-wrap { margin-top: 10px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 0.72rem; color: #9ca3af; margin-bottom: 4px; }
    .progress-bar { height: 8px; background: #e8edf2; border-radius: 999px; overflow: hidden; }
    .progress-fill-wrap { display: flex; height: 100%; }
    .fill-interest { background: #f87171; border-radius: 999px 0 0 999px; transition: width 0.3s; }
    .fill-principal { background: #60a5fa; border-radius: 0 999px 999px 0; transition: width 0.3s; }
    .btn-row { display: flex; gap: 8px; }
    .btn-calc {
      flex: 1; padding: 13px; background: #3b82f6; color: #fff;
      font-size: 0.95rem; font-weight: 600; border: none; border-radius: 10px;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-calc:hover { background: #2563eb; }
    .btn-save {
      padding: 13px 16px; background: #10b981; color: #fff;
      font-size: 0.9rem; font-weight: 600; border: none; border-radius: 10px;
      cursor: pointer; transition: background 0.2s; white-space: nowrap;
    }
    .btn-save:hover { background: #059669; }
    .btn-save:disabled { background: #a7f3d0; cursor: default; }
    .error {
      margin-top: 14px; padding: 11px 15px;
      background: #fef2f2; border-radius: 10px;
      color: #dc2626; font-size: 0.85rem; display: none;
    }
    .result { margin-top: 20px; display: none; }
    .result-main {
      background: #eff6ff; border-radius: 12px;
      padding: 20px; text-align: center; margin-bottom: 10px;
    }
    .result-months { font-size: 2.4rem; font-weight: 700; color: #2563eb; }
    .result-months span { font-size: 1.1rem; font-weight: 500; }
    .result-sub { color: #6b7c93; font-size: 0.83rem; margin-top: 4px; }
    .result-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .detail-box { background: #f7f9fb; border-radius: 10px; padding: 13px; text-align: center; }
    .detail-box .d-label { font-size: 0.75rem; color: #8a9ab0; margin-bottom: 4px; }
    .detail-box .d-value { font-size: 0.92rem; font-weight: 600; color: #1a2a3a; }
    .schedule-wrap { margin-top: 4px; }
    .schedule-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
    }
    .schedule-label { font-size: 0.85rem; font-weight: 600; color: #1a2a3a; }
    .btn-toggle {
      background: none; border: 1px solid #e0e7ef; border-radius: 8px;
      font-size: 0.78rem; color: #6b7c93; padding: 4px 10px; cursor: pointer; width: auto;
    }
    .btn-toggle:hover { background: #f7f9fb; }
    /* 공용 스케줄 테이블 */
    .schedule-table-wrap {
      max-height: 320px; overflow-y: auto;
      border: 1px solid #e8edf2; border-radius: 10px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    thead th {
      background: #f7f9fb; color: #6b7c93; font-weight: 600;
      padding: 9px 10px; text-align: right; position: sticky; top: 0;
      border-bottom: 1px solid #e8edf2;
    }
    thead th:first-child { text-align: center; }
    tbody tr { border-bottom: 1px solid #f0f4f8; transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f7f9fb; }
    tbody td { padding: 8px 10px; text-align: right; color: #1a2a3a; }
    tbody td:first-child { text-align: center; color: #8a9ab0; font-weight: 600; }
    tbody td.td-interest { color: #dc2626; }
    tbody td.td-principal { color: #2563eb; }
    tbody td.td-balance { color: #6b7c93; }
    tbody tr.last-row td { font-weight: 700; }

    /* 히스토리 */
    .history-card {
      background: #fff; border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 26px 24px; width: 100%; max-width: 520px;
    }
    .history-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 14px;
    }
    .history-title { font-size: 1.05rem; font-weight: 700; color: #1a2a3a; }
    .history-count {
      background: #eff6ff; color: #2563eb;
      font-size: 0.75rem; font-weight: 700;
      padding: 2px 9px; border-radius: 20px; margin-left: 7px;
    }
    .btn-clear-all {
      padding: 5px 12px; background: #fef2f2; color: #dc2626;
      font-size: 0.8rem; font-weight: 600;
      border: 1px solid #fecaca; border-radius: 8px;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-clear-all:hover { background: #fee2e2; }
    .history-empty { text-align: center; color: #b0bec5; font-size: 0.85rem; padding: 28px 0; }
    .history-list { display: flex; flex-direction: column; gap: 10px; }
    /* 히스토리 아이템 */
    .history-item {
      border: 1px solid #e8edf2; border-radius: 12px;
      overflow: hidden; animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    .hi-header {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 14px; cursor: pointer;
      background: #f7f9fb; transition: background 0.15s;
      user-select: none;
    }
    .hi-header:hover { background: #eff6ff; }
    .hi-header.open { background: #eff6ff; border-bottom: 1px solid #e0e7ef; }
    .hi-header-body { flex: 1; min-width: 0; }
    .hi-row1 { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; flex-wrap: wrap; }
    .hi-monthly { font-size: 0.95rem; font-weight: 700; color: #1a2a3a; }
    .hi-arrow { color: #b0bec5; font-size: 0.78rem; }
    .hi-months { font-size: 0.95rem; font-weight: 700; color: #2563eb; }
    .hi-row2 { display: flex; gap: 7px; flex-wrap: wrap; }
    .hi-tag { font-size: 0.72rem; color: #6b7c93; background: #e8edf2; border-radius: 5px; padding: 2px 7px; }
    .hi-tag.red { background: #fee2e2; color: #dc2626; }
    .hi-date { font-size: 0.7rem; color: #b0bec5; margin-top: 3px; }
    .hi-chevron {
      color: #b0bec5; font-size: 0.75rem; transition: transform 0.2s; flex-shrink: 0;
    }
    .hi-header.open .hi-chevron { transform: rotate(180deg); }
    .btn-del {
      background: none; border: none; color: #c9d5e0;
      font-size: 1rem; cursor: pointer; padding: 4px 6px;
      border-radius: 6px; transition: color 0.15s, background 0.15s;
      flex-shrink: 0; width: auto;
    }
    .btn-del:hover { color: #dc2626; background: #fef2f2; }
    /* 히스토리 상세 패널 */
    .hi-detail { display: none; padding: 16px; background: #fff; }
    .hi-detail.open { display: block; }
    .hi-summary-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px;
    }
    .hi-summary-box { background: #f7f9fb; border-radius: 10px; padding: 11px; text-align: center; }
    .hi-summary-box .s-label { font-size: 0.72rem; color: #8a9ab0; margin-bottom: 3px; }
    .hi-summary-box .s-value { font-size: 0.88rem; font-weight: 600; color: #1a2a3a; }
    .hi-schedule-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .hi-schedule-label { font-size: 0.82rem; font-weight: 600; color: #1a2a3a; }
    .btn-hi-toggle {
      background: none; border: 1px solid #e0e7ef; border-radius: 7px;
      font-size: 0.75rem; color: #6b7c93; padding: 3px 9px; cursor: pointer; width: auto;
    }
    .btn-hi-toggle:hover { background: #f7f9fb; }
    .hi-table-wrap {
      max-height: 260px; overflow-y: auto;
      border: 1px solid #e8edf2; border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>마이너스통장 상환 계산기</h1>
    <p class="subtitle">일별 이자 기준 (연 5.2% ÷ 365일 × 30일)</p>

    <div class="info-row">
      <span class="info-label">현재 잔액 (원금)</span>
      <span class="info-value">31,243,020 원</span>
    </div>
    <div class="info-row">
      <span class="info-label">연 이율</span>
      <span class="info-value">5.2% &nbsp;(일 이율 0.014247%)</span>
    </div>

    <hr class="divider">

    <label for="monthly">월 납입금액</label>
    <div class="input-wrap">
      <input type="text" id="monthly" placeholder="예: 500,000" inputmode="numeric">
      <span class="unit">원</span>
    </div>

    <div class="breakdown" id="breakdown">
      <div class="breakdown-title" id="bd-title">1개월차 납입 분석</div>
      <div class="breakdown-row">
        <span class="br-label">이자</span>
        <span class="br-value interest" id="br-interest"></span>
      </div>
      <div class="breakdown-row">
        <span class="br-label">원금 상환</span>
        <span class="br-value principal" id="br-principal"></span>
      </div>
      <div class="breakdown-row">
        <span class="br-label">납입 후 잔액</span>
        <span class="br-value remaining" id="br-remaining"></span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-label">
          <span id="p-interest-pct"></span>
          <span id="p-principal-pct"></span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill-wrap">
            <div class="fill-interest" id="fill-interest"></div>
            <div class="fill-principal" id="fill-principal"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn-calc" onclick="calculate()">총 상환 기간 계산</button>
      <button class="btn-save" id="btn-save" onclick="saveHistory()" disabled>저장</button>
    </div>

    <div class="error" id="error"></div>

    <div class="result" id="result">
      <div class="result-main">
        <div class="result-months" id="months-text"></div>
        <div class="result-sub" id="years-text"></div>
      </div>
      <div class="result-details">
        <div class="detail-box">
          <div class="d-label">총 납부금액</div>
          <div class="d-value" id="total-pay"></div>
        </div>
        <div class="detail-box">
          <div class="d-label">총 이자</div>
          <div class="d-value" id="total-interest"></div>
        </div>
        <div class="detail-box">
          <div class="d-label">마지막 달 납부액</div>
          <div class="d-value" id="last-pay"></div>
        </div>
        <div class="detail-box">
          <div class="d-label">계산 기준</div>
          <div class="d-value">일별 단리</div>
        </div>
      </div>

      <div class="schedule-wrap">
        <div class="schedule-header">
          <span class="schedule-label">월별 상환 스케줄</span>
          <button class="btn-toggle" onclick="toggleSchedule()">접기</button>
        </div>
        <div class="schedule-table-wrap" id="schedule-table-wrap">
          <table>
            <thead>
              <tr>
                <th>월차</th>
                <th>납입액</th>
                <th>이자</th>
                <th>원금상환</th>
                <th>잔액</th>
              </tr>
            </thead>
            <tbody id="schedule-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="history-card">
    <div class="history-header">
      <div style="display:flex;align-items:center;">
        <span class="history-title">계산 히스토리</span>
        <span class="history-count" id="history-count">0</span>
      </div>
      <button class="btn-clear-all" onclick="clearAll()">전체 삭제</button>
    </div>
    <div id="history-list"></div>
  </div>

  <script>
    const PRINCIPAL = 31243020;
    const ANNUAL_RATE = 5.2;
    const DAILY_RATE = ANNUAL_RATE / 100 / 365;
    const DAYS_PER_MONTH = 30;
    const STORAGE_KEY = 'car_loan_history_v2';

    let lastResult = null;
    let scheduleVisible = true;

    function calcInterest(balance) { return balance * DAILY_RATE * DAYS_PER_MONTH; }
    function fmt(n) { return Math.round(n).toLocaleString('ko-KR') + ' 원'; }
    function fmtNum(n) { return Math.round(n).toLocaleString('ko-KR'); }

    const input = document.getElementById('monthly');
    input.addEventListener('input', function () {
      const raw = this.value.replace(/,/g, '').replace(/[^0-9]/g, '');
      if (raw) this.value = Number(raw).toLocaleString('ko-KR');
      else this.value = '';
      lastResult = null;
      document.getElementById('btn-save').disabled = true;
      document.getElementById('result').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      updateBreakdown(Number(raw) || 0, PRINCIPAL);
    });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });

    function updateBreakdown(M, balance) {
      const bd = document.getElementById('breakdown');
      if (!M || M <= 0) { bd.style.display = 'none'; return; }
      const interest = calcInterest(balance);
      const principal = M - interest;
      const remaining = balance - principal;
      document.getElementById('br-interest').textContent = fmt(interest);
      document.getElementById('br-principal').textContent = principal > 0 ? fmt(principal) : '0 원 (이자도 부족)';
      document.getElementById('br-remaining').textContent = remaining > 0 ? fmt(remaining) : '완납';
      const interestPct = Math.min(100, (interest / M) * 100);
      const principalPct = Math.max(0, 100 - interestPct);
      document.getElementById('fill-interest').style.width = interestPct.toFixed(1) + '%';
      document.getElementById('fill-principal').style.width = principalPct.toFixed(1) + '%';
      document.getElementById('p-interest-pct').textContent = `이자 ${interestPct.toFixed(1)}%`;
      document.getElementById('p-principal-pct').textContent = `원금 ${principalPct.toFixed(1)}%`;
      bd.style.display = 'block';
    }

    function buildSchedule(M) {
      const rows = [];
      let balance = PRINCIPAL;
      let month = 0;
      while (balance > 0 && month < 1200) {
        month++;
        const interest = calcInterest(balance);
        const payment = Math.min(M, balance + interest);
        const principalPart = payment - interest;
        balance = balance - principalPart;
        if (balance < 1) balance = 0;
        rows.push({ month, payment, interest, principalPart, balance });
      }
      return rows;
    }

    function scheduleTableHtml(tbodyId, schedule) {
      return `<table>
        <thead><tr>
          <th>월차</th><th>납입액</th><th>이자</th><th>원금상환</th><th>잔액</th>
        </tr></thead>
        <tbody id="${tbodyId}">
          ${schedule.map(r => `
            <tr class="${r.balance === 0 ? 'last-row' : ''}">
              <td>${r.month}</td>
              <td>${fmtNum(r.payment)}</td>
              <td class="td-interest">${fmtNum(r.interest)}</td>
              <td class="td-principal">${fmtNum(r.principalPart)}</td>
              <td class="td-balance">${fmtNum(r.balance)}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
    }

    function calculate() {
      const errorEl = document.getElementById('error');
      const resultEl = document.getElementById('result');
      errorEl.style.display = 'none';
      resultEl.style.display = 'none';
      lastResult = null;
      document.getElementById('btn-save').disabled = true;

      const raw = input.value.replace(/,/g, '');
      const M = parseFloat(raw);

      if (!M || M <= 0) {
        errorEl.textContent = '월 납입금액을 입력해 주세요.';
        errorEl.style.display = 'block';
        return;
      }
      const minPayment = calcInterest(PRINCIPAL);
      if (M <= minPayment) {
        errorEl.textContent = `이자만 ${fmt(minPayment)} 입니다. 원금이 줄려면 그 이상 납입해야 합니다.`;
        errorEl.style.display = 'block';
        return;
      }

      const schedule = buildSchedule(M);
      const months = schedule.length;
      const totalPaid = schedule.reduce((s, r) => s + r.payment, 0);
      const totalInterest = totalPaid - PRINCIPAL;
      const lastPayment = schedule[months - 1].payment;

      const years = Math.floor(months / 12);
      const remMonths = months % 12;
      let yearsText = '';
      if (years > 0 && remMonths > 0) yearsText = `(${years}년 ${remMonths}개월)`;
      else if (years > 0) yearsText = `(${years}년)`;

      document.getElementById('months-text').innerHTML = `${months}<span> 개월</span>`;
      document.getElementById('years-text').textContent = yearsText;
      document.getElementById('total-pay').textContent = fmt(totalPaid);
      document.getElementById('total-interest').textContent = fmt(totalInterest);
      document.getElementById('last-pay').textContent = fmt(lastPayment);

      document.getElementById('schedule-table-wrap').innerHTML = scheduleTableHtml('schedule-tbody', schedule);
      resultEl.style.display = 'block';
      scheduleVisible = true;
      document.querySelector('.btn-toggle').textContent = '접기';
      document.getElementById('schedule-table-wrap').style.display = 'block';
      document.getElementById('bd-title').textContent = '1개월차 납입 분석';
      updateBreakdown(M, PRINCIPAL);

      lastResult = { monthly: M, months, yearsText, totalPaid, totalInterest, lastPayment };
      document.getElementById('btn-save').disabled = false;
    }

    function toggleSchedule() {
      scheduleVisible = !scheduleVisible;
      document.getElementById('schedule-table-wrap').style.display = scheduleVisible ? 'block' : 'none';
      document.querySelector('.btn-toggle').textContent = scheduleVisible ? '접기' : '펼치기';
    }

    // 히스토리 아이템 토글
    function toggleHistoryItem(id) {
      const header = document.getElementById(`hi-header-${id}`);
      const detail = document.getElementById(`hi-detail-${id}`);
      const isOpen = detail.classList.contains('open');
      if (isOpen) {
        detail.classList.remove('open');
        header.classList.remove('open');
      } else {
        detail.classList.add('open');
        header.classList.add('open');
        // 스케줄 테이블이 아직 안 그려졌으면 그리기
        const wrap = document.getElementById(`hi-table-wrap-${id}`);
        if (wrap && !wrap.dataset.rendered) {
          const h = loadHistory().find(h => h.id === id);
          if (h) {
            const schedule = buildSchedule(h.monthly);
            wrap.innerHTML = scheduleTableHtml(`hi-tbody-${id}`, schedule);
            wrap.dataset.rendered = '1';
          }
        }
      }
    }

    function toggleHiSchedule(id) {
      const wrap = document.getElementById(`hi-table-wrap-${id}`);
      const btn = document.getElementById(`hi-tog-btn-${id}`);
      const visible = wrap.style.display !== 'none';
      wrap.style.display = visible ? 'none' : 'block';
      btn.textContent = visible ? '펼치기' : '접기';
    }

    function saveHistory() {
      if (!lastResult) return;
      const history = loadHistory();
      history.unshift({ id: Date.now(), ...lastResult, savedAt: new Date().toLocaleString('ko-KR') });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      document.getElementById('btn-save').disabled = true;
      renderHistory();
    }

    function deleteHistory(id, e) {
      e.stopPropagation();
      const history = loadHistory().filter(h => h.id !== id);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      renderHistory();
    }

    function clearAll() {
      if (!loadHistory().length) return;
      if (!confirm('히스토리를 모두 삭제할까요?')) return;
      localStorage.removeItem(STORAGE_KEY);
      renderHistory();
    }

    function loadHistory() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }

    function renderHistory() {
      const history = loadHistory();
      const listEl = document.getElementById('history-list');
      document.getElementById('history-count').textContent = history.length;

      if (!history.length) {
        listEl.innerHTML = '<div class="history-empty">저장된 계산 내역이 없습니다</div>';
        return;
      }

      listEl.innerHTML = '<div class="history-list">' + history.map(h => `
        <div class="history-item">
          <div class="hi-header" id="hi-header-${h.id}" onclick="toggleHistoryItem(${h.id})">
            <div class="hi-header-body">
              <div class="hi-row1">
                <span class="hi-monthly">${fmtNum(h.monthly)}원/월</span>
                <span class="hi-arrow">→</span>
                <span class="hi-months">${h.months}개월 ${h.yearsText || ''}</span>
              </div>
              <div class="hi-row2">
                <span class="hi-tag">총납부 ${fmtNum(h.totalPaid)}원</span>
                <span class="hi-tag red">이자 ${fmtNum(h.totalInterest)}원</span>
              </div>
              <div class="hi-date">${h.savedAt}</div>
            </div>
            <span class="hi-chevron">▼</span>
            <button class="btn-del" onclick="deleteHistory(${h.id}, event)" title="삭제">✕</button>
          </div>
          <div class="hi-detail" id="hi-detail-${h.id}">
            <div class="hi-summary-grid">
              <div class="hi-summary-box">
                <div class="s-label">월 납입액</div>
                <div class="s-value">${fmtNum(h.monthly)}원</div>
              </div>
              <div class="hi-summary-box">
                <div class="s-label">총 상환 기간</div>
                <div class="s-value">${h.months}개월 ${h.yearsText || ''}</div>
              </div>
              <div class="hi-summary-box">
                <div class="s-label">총 납부금액</div>
                <div class="s-value">${fmtNum(h.totalPaid)}원</div>
              </div>
              <div class="hi-summary-box">
                <div class="s-label">총 이자</div>
                <div class="s-value" style="color:#dc2626">${fmtNum(h.totalInterest)}원</div>
              </div>
              <div class="hi-summary-box">
                <div class="s-label">마지막 달 납부액</div>
                <div class="s-value">${fmtNum(h.lastPayment)}원</div>
              </div>
              <div class="hi-summary-box">
                <div class="s-label">계산 기준</div>
                <div class="s-value">일별 단리</div>
              </div>
            </div>
            <div class="hi-schedule-header">
              <span class="hi-schedule-label">월별 상환 스케줄</span>
              <button class="btn-hi-toggle" id="hi-tog-btn-${h.id}" onclick="toggleHiSchedule(${h.id})">접기</button>
            </div>
            <div class="hi-table-wrap" id="hi-table-wrap-${h.id}"></div>
          </div>
        </div>
      `).join('') + '</div>';
    }

    renderHistory();
  </script>
</body>
</html>
